name: Test modules

on:
  push:
    branches: [main, 'milestone/*', 'fix/*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  node:
    name: Node module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          MOCKSMS_TEST_DOCKER: '1'

  go:
    name: Go module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
      - run: go test ./...
        env:
          MOCKSMS_TEST_DOCKER: '1'

  python:
    name: Python module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[test]'
      - run: pytest
        env:
          MOCKSMS_TEST_DOCKER: '1'
